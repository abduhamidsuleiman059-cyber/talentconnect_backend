{% load static %}
<!DOCTYPE html>
  <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="login-page">

    <!-- HEADER -->
    <header class="site-header">
        <div class="logo-container">
            <img src="{% static 'images/logo.png' %}" alt="Logo">
            <h1>TalentConnect</h1>
        </div>
        <button type="button" class="nav-menu-toggle" aria-controls="primary-nav" aria-expanded="false" aria-label="Open menu">
            <span class="nav-menu-icon" aria-hidden="true"></span>
        </button>
    </header>

    <!-- NAVBAR -->
    <nav class="site-nav" id="primary-nav">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'discover' %}">Discover</a>
        <a href="{% url 'upload' %}">Upload</a>
        <a href="{% url 'contact' %}">Contact</a>
        <a href="{% url 'entertainment' %}">Entertainment</a>
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Register</a>
    </nav>

    <!-- LOGIN FORM -->
<div class="form-container">
    <h2>Login</h2>

    <form method="POST">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Username">
    <input type="password" name="password" placeholder="Password">

    <button type="submit">Login</button>
</form>
    <p>
        Don't have an account?
        <a href="{% url 'register' %}">Register here</a>
    </p>
</div>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
